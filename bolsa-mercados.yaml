apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-datos
  labels:
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: bolsa-mercados
    app.openshift.io/runtime: mysql-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/part-of: bolsa-mercados
    spec:
      containers:
        - name: mysql
          image: registry.access.redhat.com/rhel9/mysql-80:latest
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-credenciales
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql/data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mysql-datos
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
# Carga schema.sql en MySQL (espera a que el servidor esté listo y reintenta).
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-cargar-schema
  labels:
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cargar
          image: registry.access.redhat.com/rhel9/mysql-80:latest
          envFrom:
            - secretRef:
                name: mysql-credenciales
          command:
            - /bin/bash
            - -c
            - |
              until mysqladmin ping -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do
                echo "Esperando a MySQL..."; sleep 5
              done
              mysql -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --default-character-set=utf8mb4 < /schema/schema.sql
              echo "schema.sql cargado"
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: mysql-schema
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
---
# Construye la imagen desde el Dockerfile del repositorio de GitHub.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  source:
    type: Git
    git:
      uri: https://github.com/Juan-11213/mercados
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: bolsa-mercados:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/name: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
    app.openshift.io/runtime: python
  annotations:
    app.openshift.io/vcs-uri: https://github.com/Juan-11213/mercados
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"mysql"}]'
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"bolsa-mercados:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bolsa-mercados
  template:
    metadata:
      labels:
        app: bolsa-mercados
        app.kubernetes.io/part-of: bolsa-mercados
    spec:
      containers:
        - name: web
          image: bolsa-mercados:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_DATABASE
          readinessProbe:
            httpGet:
              path: /salud
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  selector:
    app: bolsa-mercados
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  to:
    kind: Service
    name: bolsa-mercados
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
