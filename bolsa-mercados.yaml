# =====================================================================
# Bolsa de Valores y Mercados Internacionales - Red Hat OpenShift Developer Sandbox
# Uso: consola web -> +Add -> Import YAML -> pegar TODO -> Create
#      (o: oc apply -f bolsa-mercados.yaml)
# No lleva namespace: se crea en el proyecto que tengas seleccionado.
# Repositorio de la app: https://github.com/Juan-11213/base
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credenciales
  labels:
    app.kubernetes.io/part-of: bolsa-mercados
type: Opaque
stringData:
  MYSQL_USER: bolsa
  MYSQL_PASSWORD: 4082738ea545b97e
  MYSQL_ROOT_PASSWORD: 24b6528082d98f94
  MYSQL_DATABASE: bolsa_mercados
---
# Configuracion NO sensible de la app (host y puerto del Service interno de MySQL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bolsa-mercados-config
  labels:
    app.kubernetes.io/part-of: bolsa-mercados
data:
  DB_HOST: mysql
  DB_PORT: "3306"
---
# Tu SQL original. Es la copia de schema.sql del repositorio (mantenerlos iguales).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-schema
  labels:
    app.kubernetes.io/part-of: bolsa-mercados
data:
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS bolsa_mercados;
    -- Asegura utf8mb4 (los simbolos de moneda como el euro y la libra lo necesitan).
    ALTER DATABASE bolsa_mercados CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE bolsa_mercados;

    CREATE TABLE usuarios (
        id_usuario INT AUTO_INCREMENT PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        correo VARCHAR(100) UNIQUE NOT NULL,
        contrasena VARCHAR(255) NOT NULL,
        fecha_registro TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE mercados (
        id_mercado INT AUTO_INCREMENT PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        pais VARCHAR(100) NOT NULL,
        ciudad VARCHAR(100)
    );

    CREATE TABLE empresas (
        id_empresa INT AUTO_INCREMENT PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        sector VARCHAR(100),
        pais VARCHAR(100),
        simbolo VARCHAR(20) UNIQUE
    );

    CREATE TABLE monedas (
        id_moneda INT AUTO_INCREMENT PRIMARY KEY,
        nombre VARCHAR(50) NOT NULL,
        codigo VARCHAR(10) UNIQUE NOT NULL,
        simbolo VARCHAR(10)
    );

    CREATE TABLE activos (
        id_activo INT AUTO_INCREMENT PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        tipo VARCHAR(50),
        simbolo VARCHAR(20),
        id_empresa INT,
        id_mercado INT,
        FOREIGN KEY (id_empresa) REFERENCES empresas(id_empresa),
        FOREIGN KEY (id_mercado) REFERENCES mercados(id_mercado)
    );

    CREATE TABLE precios_historicos (
        id_precio INT AUTO_INCREMENT PRIMARY KEY,
        id_activo INT NOT NULL,
        precio DECIMAL(15,2) NOT NULL,
        fecha DATETIME DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (id_activo) REFERENCES activos(id_activo)
    );

    CREATE TABLE tasas_cambio (
        id_tasa INT AUTO_INCREMENT PRIMARY KEY,
        id_moneda_origen INT NOT NULL,
        id_moneda_destino INT NOT NULL,
        tasa DECIMAL(15,6) NOT NULL,
        fecha DATETIME DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (id_moneda_origen) REFERENCES monedas(id_moneda),
        FOREIGN KEY (id_moneda_destino) REFERENCES monedas(id_moneda)
    );

    CREATE TABLE favoritos (
        id_favorito INT AUTO_INCREMENT PRIMARY KEY,
        id_usuario INT NOT NULL,
        id_activo INT NOT NULL,
        fecha_agregado TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (id_usuario) REFERENCES usuarios(id_usuario),
        FOREIGN KEY (id_activo) REFERENCES activos(id_activo)
    );

    CREATE TABLE carteras_virtuales (
        id_cartera INT AUTO_INCREMENT PRIMARY KEY,
        id_usuario INT NOT NULL,
        nombre VARCHAR(100) NOT NULL,
        saldo_virtual DECIMAL(15,2) DEFAULT 100000.00,
        fecha_creacion TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (id_usuario) REFERENCES usuarios(id_usuario)
    );

    CREATE TABLE detalle_cartera (
        id_detalle INT AUTO_INCREMENT PRIMARY KEY,
        id_cartera INT NOT NULL,
        id_activo INT NOT NULL,
        cantidad DECIMAL(15,4) NOT NULL,
        precio_compra DECIMAL(15,2) NOT NULL,
        fecha_compra TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (id_cartera) REFERENCES carteras_virtuales(id_cartera),
        FOREIGN KEY (id_activo) REFERENCES activos(id_activo)
    );

    CREATE TABLE noticias (
        id_noticia INT AUTO_INCREMENT PRIMARY KEY,
        titulo VARCHAR(200) NOT NULL,
        descripcion TEXT,
        fuente VARCHAR(100),
        fecha_publicacion DATETIME DEFAULT CURRENT_TIMESTAMP,
        id_empresa INT,
        FOREIGN KEY (id_empresa) REFERENCES empresas(id_empresa)
    );

    CREATE TABLE alertas (
        id_alerta INT AUTO_INCREMENT PRIMARY KEY,
        id_usuario INT NOT NULL,
        id_activo INT NOT NULL,
        precio_objetivo DECIMAL(15,2) NOT NULL,
        tipo_alerta VARCHAR(30),
        estado VARCHAR(30) DEFAULT 'Activa',
        fecha_creacion TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (id_usuario) REFERENCES usuarios(id_usuario),
        FOREIGN KEY (id_activo) REFERENCES activos(id_activo)
    );

