---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-datos
  labels:
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: bolsa-mercados
    app.openshift.io/runtime: mysql-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/part-of: bolsa-mercados
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: registry.access.redhat.com/rhel9/mysql-80:latest
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_DATABASE
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql/data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mysql-datos
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
---
# Construye la imagen con el Dockerfile del repositorio de GitHub.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  source:
    type: Git
    git:
      uri: https://github.com/Juan-11213/base
      ref: main
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: bolsa-mercados:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/name: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
    app.openshift.io/runtime: python
  annotations:
    app.openshift.io/vcs-uri: https://github.com/Juan-11213/base
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"mysql"}]'
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"bolsa-mercados:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bolsa-mercados
  template:
    metadata:
      labels:
        app: bolsa-mercados
        app.kubernetes.io/part-of: bolsa-mercados
    spec:
      enableServiceLinks: false
      # Antes de arrancar Flask: espera a MySQL y carga schema.sql SOLO si la BD no tiene tablas.
      # Si la BD ya tiene tablas (volumen con datos) no toca nada.
      initContainers:
        - name: inicializar-bd
          image: registry.access.redhat.com/rhel9/mysql-80:latest
          envFrom:
            - configMapRef:
                name: bolsa-mercados-config
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_DATABASE
          command:
            - /bin/bash
            - -c
            - |
              set -u
              export MYSQL_PWD="$MYSQL_PASSWORD"
              CONEXION="-h $DB_HOST -P $DB_PORT -u$MYSQL_USER"

              echo "Esperando a MySQL en $DB_HOST:$DB_PORT ..."
              until mysql $CONEXION -e "SELECT 1" "$MYSQL_DATABASE" >/dev/null 2>&1; do
                sleep 5
              done
              echo "MySQL responde."

              TABLAS=$(mysql $CONEXION -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$MYSQL_DATABASE'")
              if [ -z "$TABLAS" ]; then
                echo "ERROR: no se pudo contar las tablas"
                exit 1
              fi

              if [ "$TABLAS" = "0" ]; then
                echo "Base de datos vacia: cargando schema.sql ..."
                if mysql $CONEXION --default-character-set=utf8mb4 < /schema/schema.sql; then
                  echo "schema.sql cargado correctamente."
                else
                  echo "ERROR: fallo la carga. Se limpian las tablas para reintentar desde cero."
                  mysql $CONEXION "$MYSQL_DATABASE" -e "SET FOREIGN_KEY_CHECKS=0; DROP TABLE IF EXISTS alertas, noticias, detalle_cartera, carteras_virtuales, favoritos, tasas_cambio, precios_historicos, activos, monedas, empresas, mercados, usuarios; SET FOREIGN_KEY_CHECKS=1;"
                  exit 1
                fi
              else
                echo "La base de datos ya tiene $TABLAS tablas: no se carga nada."
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: schema
              mountPath: /schema
      containers:
        - name: web
          image: bolsa-mercados:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bolsa-mercados-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credenciales
                  key: MYSQL_DATABASE
          readinessProbe:
            httpGet:
              path: /salud
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: schema
          configMap:
            name: mysql-schema
---
apiVersion: v1
kind: Service
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  selector:
    app: bolsa-mercados
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bolsa-mercados
  labels:
    app: bolsa-mercados
    app.kubernetes.io/part-of: bolsa-mercados
spec:
  to:
    kind: Service
    name: bolsa-mercados
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
